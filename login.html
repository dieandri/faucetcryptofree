<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Arcade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER (Minimalis untuk halaman login) -->
    <header>
        <div class="container nav-container">
            <a href="https://dieandri.github.io/yudiandriana/" class="logo">Back dieandri</a>
            <div style="display: flex; gap: 10px;">
                <a href="rewards.html" class="btn btn-outline">Back to Home</a>
            </div>
        </div>
    </header>

    <!-- LOGIN CONTENT -->
    <main class="login-container">
        <div class="login-box">
            <h2>Welcome Back!</h2>
            
            <!-- Form Login -->
            <input type="email" placeholder="Email address">
            <input type="password" placeholder="Password">
            
            <!-- Kembali ke Rewards setelah login simulasi -->
            <a href="rewards.html" class="btn btn-orange">Login Now</a>
            <a href="rewards.html" class="btn btn-outline">Create Account</a>
        </div>
    </main>

</body>
</html>
